[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calveris"
version = "0.2.0a2"
description = "CalverIS - bahasa pemrograman Indonesia-first dengan kompatibilitas polyglot"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Calver"}]
keywords = ["calveris", "cvis", "indonesian", "programming-language", "polyglot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
calver = "calveris.cli:main"

[tool.setuptools]
packages = ["calveris"]
